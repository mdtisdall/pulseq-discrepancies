# The sources that discrepancy records compare, each at a pinned version.
# A record refers to a source by its key (docs/record-format.md, section 3).
# The pins are those of pulseq-analysis's docs/discrepancies.md at commit 5bd053a.

spec:
  name: Pulseq specification
  repo: pulseq/pulseq
  commit: c7469123c2f381f065986e6cc3a7d09730ed16ef
  path: doc/specification.tex
  version: "1.5.3 (DRAFT)"
  cite_as: "spec:N"

spec-slides:
  name: Slide set of the specification (timing, normative)
  repo: pulseq/pulseq
  commit: c7469123c2f381f065986e6cc3a7d09730ed16ef
  path: doc/pulseq_shapes_and_times.pdf
  cite_as: "slide N"

cpp-reader:
