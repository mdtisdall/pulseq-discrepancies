# The sources that discrepancy records compare, each at a pinned version.
# A record refers to a source by its key (docs/record-format.md, section 3).
# The pins of spec, spec-slides, cpp-reader and matlab-pulseq are those of
# pulseq-analysis's docs/discrepancies.md at commit 5bd053a.

spec:
  name: Pulseq specification
  repo: pulseq/pulseq
  commit: c7469123c2f381f065986e6cc3a7d09730ed16ef
  path: doc/specification.tex
  version: "1.5.3 (DRAFT)"
  cite_as: "spec:N"

spec-slides:
  name: Slide set of the specification (timing, normative)
  repo: pulseq/pulseq
  commit: c7469123c2f381f065986e6cc3a7d09730ed16ef
  path: doc/pulseq_shapes_and_times.pdf
  cite_as: "slide N"

cpp-reader:
  name: C++ reader (ExternalSequence), the reader of the scanner's interpreter
  repo: pulseq/pulseq
  commit: c7469123c2f381f065986e6cc3a7d09730ed16ef
  path: src/ExternalSequence.cpp, src/ExternalSequence.h
  cite_as: "cpp:N, cpp.h:N"

matlab-pulseq:
  name: MATLAB Pulseq
  repo: pulseq/pulseq
  commit: c7469123c2f381f065986e6cc3a7d09730ed16ef
  path: matlab/
  cite_as: "<file>.m:N"

pypulseq:
  name: pypulseq
  # A pypulseq statement is checked on both the release and master, never on a
  # fork. When the two differ, the record has one entry for each, with `version`.
  repo: pulseq/pypulseq
  commit: c977214ff439c0adf94d0e1ef8af44949f215e9b
  version: "master, 2026-10-12"
  release:
    version: "1.5.0.post1"
    tag: v1.5.0.post1
    commit: 9acd4f02fc7fcb2277721a49186bd5628dddbb6a
  path: pypulseq/
  cite_as: "<file>.py:N"
